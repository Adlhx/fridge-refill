services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fridge_refill}
      POSTGRES_USER: ${POSTGRES_USER:-fridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fridge}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER}"], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes: [media_data:/app/media]
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
  frontend:
    build: {context: ./frontend, args: {VITE_API_URL: ${VITE_API_URL:-/api}}}
    restart: unless-stopped
    ports: ["5173:80"]
    depends_on: [backend]
volumes: {postgres_data: {}, media_data: {}}
